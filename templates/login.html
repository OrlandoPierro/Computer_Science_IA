{% extends 'base.html' %}
{% block title %}Log in · IB PG Estimator{% endblock %}
{% block content %}
<section class="auth-card card"><div class="card-body">
  <h1>Welcome again!</h1>
  <form method="post" action="{{ url_for('login') }}">
    <div class="mb-3">
      <label class="form-label" for="username">Username</label>
      <input class="form-control form-control-lg" type="text" id="username" name="username" autocomplete="username" placeholder="Enter your username" required autofocus value="{{ request.form.get('username', '') }}">
    </div>
    <div class="mb-4">
      <label class="form-label" for="password">Password</label>
      <div class="input-group">
        <input class="form-control form-control-lg" type="password" id="password" name="password" autocomplete="current-password" placeholder="Enter your password"  required aria-describedby="password-help">
        <button class="btn btn-outline-secondary password-toggle" type="button" data-password-toggle="password" aria-label="Show password" aria-pressed="false">Show</button>
      </div>
    </div>
    <button class="btn btn-primary btn-lg w-100" type="submit">Log in <span aria-hidden="true">→</span></button>
  </form>
  <p class="auth-switch">Don’t have an account? <a href="{{ url_for('register') }}">Register here</a></p>
</div></section>
{% endblock %}
