{% extends 'base.html' %}
{% block title %}Welcome · IB PG Estimator{% endblock %}
{% block content %}
<section class="auth-card card">
  <div class="card-body">
    <h1>Welcome!</h1>
    <p class="text-secondary mb-4">You aren’t logged in.</p>
    <a class="btn btn-primary btn-lg w-100" href="{{ url_for('login') }}">Log in here <span aria-hidden="true">→</span></a>
    <div class="auth-divider"></div>
    <p class="text-secondary">Don’t have an account?</p>
    <a class="btn btn-outline-primary w-100" href="{{ url_for('register') }}">Register here</a>
  </div>
</section>
{% endblock %}
