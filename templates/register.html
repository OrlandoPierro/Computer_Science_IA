{% extends 'base.html' %}
{% block title %}Register · IB PG Estimator{% endblock %}
{% block content %}
<section class="auth-card card"><div class="card-body">
  <h1>Welcome!</h1>
  <form method="post" action="{{ url_for('register') }}">
    <div class="mb-3">
      <label class="form-label" for="username">Username</label>
      <input class="form-control form-control-lg" type="text" id="username" name="username" autocomplete="username" placeholder="Create your username" required autofocus value="{{ request.form.get('username', '') }}">
    </div>
    <div class="mb-4">
      <label class="form-label" for="password">Password</label>
      <div class="input-group">
        <input class="form-control form-control-lg" type="password" id="password" name="password" autocomplete="new-password" placeholder="Create your password" minlength="8" required aria-describedby="password-help">
        <button class="btn btn-outline-secondary password-toggle" type="button" data-password-toggle="password" aria-label="Show password" aria-pressed="false">Show</button>
      </div>
      <div class="form-text" id="password-help">Use at least 8 characters.</div>
    </div>
    <button class="btn btn-primary btn-lg w-100" type="submit">Register <span aria-hidden="true">→</span></button>
  </form>
  <p class="auth-switch">Already have an account? <a href="{{ url_for('login') }}">Log in here</a></p>
</div></section>
{% endblock %}
